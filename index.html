@L-01 | learn | Glossary 1: the chart and the chain | The words you need before you can state a single equation.
T Term | Meaning
Cusp | The starting point of a house. Its "main door".
CSL | Cuspal Sub Lord: the sub lord of a cusp. The gate for that house's matters.
Primary cusp | The one cusp that answers the question.
Star lord | The lord of the star a planet sits in. The planet gives its star lord's results.
Sub lord | The lord of the sub a planet or cusp sits in. It qualifies and shows nature.
Deposition | The house a planet occupies, after applying the orb.
Ownership | The houses whose cusps fall in the planet's signs. Rahu and Ketu own none.
Orb | The planet's reach: Sun 6°40′, others 3°20′.
Conjoined, opposing | Planets linked within the orb, in the same or the opposite sign and house.
Significator | A planet that signifies a house through its ABCD.
ABCD | Star lord's deposition, own deposition, star lord's ownership, own ownership.
L1 to L4 | Strength levels of a planet for a house, used for periods.
Tenanted | Some planet sits in one of this planet's three stars. Untenanted: none does.
Equation | The CSL's result written as "house = deposition (ownership)".
Standard, derived | The equation from the star lord alone, and with conjoined and opposing planets added.
Promise | What the CSL's chain allows. Without it, no period gives the event.
Displaced cusps | Two cusps in one sign, so one sign lord owns two houses.

F Compiled from the foundations digests, the orb rule, Bootcamp Class 10 and the Prashna cheat sheet.
> L-02 L-03

@L-02 | learn | Glossary 2: checks, periods and timing | The words that come up once the equation is written.
T Term | Meaning
Improving houses | 1, 2, 3, 6, 10, 11.
Afflicted | Activating 6, 8 or 12.
Benefic, malefic | By the house of the planet's sub lord. For periods only.
Barren signs | Aries, Gemini, Leo, Virgo.
Fruitful star | A star whose lord signifies the matter's good houses. Used for the Sun–Moon timing table.
Maraka | Houses 2 and 7.
Badhaka | 11th, 9th or 7th, for a movable, fixed or dual Lagna.
Punarpoo | A Moon–Saturn link that delays marriage until about 33 unless the Sun cancels it.
Oddity | An out-of-the-ordinary love or marriage, shown by Saturn on the CSL.
Duality | A Mercury or Jupiter signature on the CSL. Needed for a second marriage.
Rotation | Turning the chart so a relative's house becomes the 1st.
Genuineness | Whether the Prashna Moon reflects the question.
Horary number | A random number from 1 to 249 that fixes the Lagna.
DBAS | Dasa, Bhukti, Antara, Sukshma.
Ruling Planets | The seven lords of the moment of judgement. For timing only.
Fortuna | Lagna + Moon − Sun. Used to choose a good day.
BTR | Birth-time rectification.
KPDP | The ten-step marriage-matching method.
Prediction Analysis | The app's chain view for a cusp. Read it in the app's order.

F Compiled from the class digests, the Prashna cheat sheet and the Ruling Planets source of truth.
> L-01 L-03

@L-03 | learn | What makes KP different | Hold these first. Every later rule rests on them.
C Planets propose. The Cuspal Sub Lord disposes. The Dasha delivers.
K
Unequal houses :: KP uses Placidus cusps. A house can be more or less than 30°, and two cusps can fall in one sign.
The star is supreme :: A planet is the tenant of its star. It gives the results of its star lord.
The sub lord decides :: KSK found the sub lord to explain twins. The sub lord of the primary cusp promises or denies the event.
No planet is good or bad :: Rahu or Saturn can give the best results, Jupiter the worst. Only the chart decides.
The chart is a photograph :: It is not a movie. Retrograde never reverses the orb.
Deposition beats ownership :: Where a planet sits matters more than what it owns.

# What KP does not use
T -
Exaltation, debilitation | Ignored entirely. No dignity ladder.
"Combust" | There is no such word. A planet near the Sun is simply conjunct the Sun.
Sade Sati | Rejected. Trouble is timed by the karma the planets activate.
Gochara | Not used. Transits serve only to time a promised event.
Sign lord as significator | Never. The sign shows only nature.
Uranus, Neptune, Pluto | Ignored.

F Classes 001–002 foundations, Class 004, Class 007, Bootcamp Class 10, Prashna cheat sheet.
> L-04 L-05 L-06

@L-04 | learn | Sign, star, sub: three lords for every degree | Every point in the sky has one sign lord, one star lord and one sub lord.
K
12 signs :: 30° each. Lord = the sign owner.
27 stars :: 13°20′ each. Lord = the star lord.
249 subs :: Each star is cut into 9 unequal subs.

# How wide each sub is
P The subs follow the Vimshottari order and its proportions, starting from the star lord itself. The dasha years are the same proportions.
T Sub lord | Width in a star | Dasha years
Ketu | 0°46′40″ | 7
Venus | 2°13′20″ | 20
Sun | 0°40′00″ | 6
Moon | 1°06′40″ | 10
Mars | 0°46′40″ | 7
Rahu | 2°00′00″ | 18
Jupiter | 1°46′40″ | 16
Saturn | 2°06′40″ | 19
Mercury | 1°53′20″ | 17

# Why 249 and not 243
T -
243 | 27 stars × 9 subs.
+ 3 | Rahu's sub spans two signs in the three Sun-ruled stars: Krittika, Uttara Phalguni, Uttara Ashadha.
+ 3 | Moon's sub spans two signs in the three Jupiter-ruled stars: Punarvasu, Vishakha, Purva Bhadrapada.

P The first sub in any star belongs to the star lord. A horary number from 1 to 249 names one of these subs and fixes the Lagna.
F Class 004 (249 derivation), Class 007 (Vimshottari). Sub widths are 13°20′ × years ÷ 120.
> L-13

@L-05 | learn | What a sign tells you | The sign is read only for nature: modality, element, barren or not, duality.
# Modality, and the Badhaka house it sets
T Modality | Signs | Badhaka
Movable (Chara) | Aries, Cancer, Libra, Capricorn | 11th
Fixed (Sthira) | Taurus, Leo, Scorpio, Aquarius | 9th
Dual (Ubhaya) | Gemini, Virgo, Sagittarius, Pisces | 7th

P Remember only that Aries is movable. The order then cycles movable, fixed, dual.
# Element
T -
Fire | Aries, Leo, Sagittarius
Land (earth) | Taurus, Virgo, Capricorn
Air | Gemini, Libra, Aquarius
Water | Cancer, Scorpio, Pisces

# Barren signs
C Aries, Gemini, Leo, Virgo are barren. All other signs can give.
P Barren signs matter for marriage and childbirth. If the CSL and its star lord are both in barren signs, the matter is denied.
# Fixed for every chart
T -
Maraka houses | 2 and 7.
Dual Lagna | The 7th is Badhaka, so the effective Maraka is the 2nd only.

F Class 008 (modality, Badhaka, Maraka), Prashna cheat sheet step 8 (barren signs), Classes 001–002.
> P-04 D-06

@L-06 | learn | Twelve cusps: what each CSL answers | Pick the cusp from the question. Its sub lord is the CSL you read.
T CSL | Read it for
1st | Longevity, immunity, personality, personal luck and success
2nd | Rich or poor, assets, wealth, speech, family
3rd | Mindset, memory, competitive exams, short travel, younger sibling, father-in-law
4th | Mother, school education, property, vehicle, homeland
5th | Love, first child (for the mother), speculation, addiction, mantra, arts, sports, cure
6th | Job, earned income, labour, and also disease. A dual house
7th | Legal marriage, spouse, business partner, client, boss, known enemies
8th | Difficulties, losses, sudden events, accidents, diagnosis, inheritance, insurance
9th | Father, guru, higher education, wisdom, occult study, long travel
10th | Profession, name and fame, power, promotion, government, mother-in-law
11th | Fulfilment, success, incremental income, elder sibling, friends, well-wishers
12th | Foreign travel, hospitalisation, court case, hidden enemies, heavy losses, investments

P Travel by distance: under 30 miles is the 3rd, 30 to 300 the 9th, over 300 the 12th.
F Class 005, per-house CSL significations.
> L-07 Q-00

@L-07 | learn | House groups you must know cold | A matter is promised when the CSL connects to its favourable group.
K
Improving :: 1, 2, 3, 6, 10, 11
Non-improving :: 4, 5, 7, 8, 9, 12
Afflicted :: 6, 8, 12

T Matter | Favourable houses
Income | 2, 3, 6, 10, 11 (2, 6, 11 most important)
Disease | 6, 8, 12
Cure | 5, 11 (plus 3 and 9 for prevention and control)
Marriage | 2, 7, 11
Childbirth | 2, 5, 11
Travel | 3, 9, 12
House | 2, 4, 11
Vehicle | 2, 4, 9, 11

# Three things to say about 6, 8 and 12
T -
6 is dual | It is both an income house and a disease house. Decide by the matter.
Self-exception | 12 = 12 promises foreign travel. 8 = 8 favours inheritance.
Scope | A reading holds only for the matter judged. The same house is good for one question and bad for another.

# The 5th is a maximiser
P 5 with 2, 3, 6, 10, 11 gives huge wealth. 5 with 8, 9, 12 gives huge poverty.
O Counted from the 7th, the improving set flips to favour the opponent. 6 is not improving for marriage, and 4 is not for childbirth. These come from the older playbook layer.
O The house and vehicle rows here are the Class 005 quick map. The Prashna table in [[Q-00]] lists house 2, 4, 6, 11 and vehicle 2, 4, 6, 9, 11. See [[B-01]].
F Class 005 (house groups, doctrines), Bootcamp Class 10 (5th house), prediction framework section 5.
> Q-00 B-01

@L-08 | learn | The orb: which house a planet really gives | A planet rings the door of the next house if its orb reaches that cusp.
K
Sun :: Orb 6°40′
Every other planet :: Orb 3°20′

# The deposition test, in order
S
Count. :: House H is the last cusp at or before the planet. A planet exactly on a cusp gives that house.
Look ahead. :: Find the next cusp forward, H + 1.
Sign wall. :: If that cusp is not in the planet's own sign, the planet gives H. Stop.
Gap. :: Cusp degree minus planet degree.
Compare. :: Gap within the orb gives H + 1. A gap exactly equal to the orb counts as within.
Tiny house. :: If the cusp after that is in the same sign, repeat. The planet gives the farthest cusp it reaches.

# Edge rules
T -
Forward only | Add the orb clockwise. Never subtract. A cusp behind the planet does nothing.
Retrograde | Makes no difference to the orb.
Vacant sign | No cusp in the planet's sign means no orb. It gives the house that began earlier.

P Example. Sun at Leo 17°57′, 6th cusp at Leo 19°55′. Sun + 6°40′ reaches the cusp, so the Sun is in the 6th.
P In practice you read the app's "Occupies" column and the ABCD grid. They already apply the orb.
F Orb rule source of truth, sections 1, 2 and 2A.
> L-09

@L-09 | learn | Conjunction and opposition | A planet joined or opposed by another picks up that planet's results.
# Conjunction needs all three
S
Same sign. :: Two planets in different signs are never conjunct, even 1° apart.
Same house, with no cusp between them. :: Count from the cusps here. The deposition orb is not used for this.
Gap within the orb :: of the planet that reaches out.

# Opposition
P Opposite signs, opposite houses, and within 180° plus or minus the orb. Rahu and Ketu are always opposite each other.
# The Sun ladder
T Sun to planet gap | Result
Up to 3°20′ | Two-way link
Over 3°20′, up to 6°40′ | One-way: the Sun reaches the planet, not the reverse
Over 6°40′ | None

# Things to say correctly
T -
Whose orb | The orb belongs to the planet that reaches out. Test both directions.
The door | A cusp is a main door. Two planets can shake hands only if no door stands between them.
Retrograde | A retrograde planet is tested exactly like a direct one.
Why it matters | The ABCD grid does not carry this layer. Leaving it out gives wrong significators.

F Orb rule source of truth, sections 3 and 3A (Bootcamp Class 4).
> L-10 L-11

@L-10 | learn | ABCD and L1 to L4 | Two ways of listing the houses a planet signifies.
# ABCD: the planet and its star lord
T Level | Meaning | Strength
A | Star lord's deposition | Strongest
B | The planet's own deposition |
C | Star lord's ownership |
D | The planet's own ownership | Weakest

P Notation. Deposition first, ownership in brackets. Rahu in Dhanishta, star lord Mars in 12 owning 5, Rahu itself in 8: Rahu = 12, 8, [5].
# L1 to L4: adds the sub, conjoined and opposing lords
T -
L1 | A star, sub, conjoined or opposing lord is deposited in the house. Very strong.
L2 | The planet itself is deposited there. Good.
L3 | One of those lords owns the house.
L4 | The planet itself owns the house. Weakest.

P Each house is shown once, at its strongest level. A planet in its own star shows L1.
C Strength is for judging periods. It is not used to judge the promise.
P Untenanted means no planet sits in any of the planet's three stars.
O The exact ranking order inside L1 to L4 is fitted from the app's table and is not confirmed by Sir. The doctrine is "all deposition first, then ownership".
F Class 004 (ABCD), Bootcamp Class 10 sections 3.2 and 3.9, L1–L4 ranking rules file.
> L-11 C-04

@L-11 | learn | Reading a CSL: follow the star lord | The CSL never gives its own houses. It speaks through its chain.
T Link in the chain | Power | How to use it
Star lord's deposition | Supreme | The headline. Nothing can deny it.
Star lord's ownership | Enhances | Adds to the headline. Ownership never denies.
Planets conjoined with or opposing the CSL or its star lord | Interfere | Each passes on to its own star lord, whose result comes more strongly than its own.
The CSL's sub lord | Qualifies | A minor confirmation. Never merged into the headline.

# Three rules
S
The CSL gives its star lord's result, :: never its own deposition or ownership.
A conjoined or opposing planet gives its star lord's result, :: more strongly than its own houses.
The chain stops at a star lord. :: Never step on to the star lord's star lord.

# Writing the equation
P 7th CSL Venus, in the star of Mercury, Mercury deposited in 11 and owning 2 and 7: 7 = 11 (2, 7). Branches and the sub lord go on the next lines as qualifiers.
# Rahu or Ketu as the CSL
P Read in this order: its conjoined planet, then its star lord, then its opposition, and the sign lord only as a last resort.
# The sub lord gives the nature, not the result
P For the 7th CSL: Saturn points to an age gap, Rahu to lower social status, Ketu to another religion.
F Prashna cheat sheet steps 5–6, Bootcamp Class 10 sections 3.1 and 3.9.
> C-02 C-08

@L-12 | learn | Benefic, malefic, afflicted | Two separate tests. Both are for periods only, never for the promise.
T Test | Rule
Benefic or malefic | Look at the house of the planet's sub lord. In 1, 2, 3, 6, 10, 11 it is benefic. In 4, 5, 7, 8, 9, 12 it is malefic.
Afflicted | The planet activates 6, 8 or 12 anywhere in its ABCD.

# Read the two together
T Nature | Unafflicted | Afflicted
Benefic | Gives and improves. | Trouble comes, then it tries to improve life again.
Malefic | Gives what it signifies but cannot improve. | Worst: trouble and no improvement.

# What an afflicted planet does
P It always troubles its own period, in the house it afflicts. 8 brings loss and shocks. 12 brings loss and exit. 6 brings debt, disease and job issues.
C Malefic does not mean it destroys. It means it lacks the power to improve life in its period.
P 6 is an improving house, so it gives both good and bad.
O Class 7 tested affliction only at A or B. Class 10 widened it to the whole ABCD. Class 10 wins where they differ.
F Class 007 section B, Bootcamp Class 10 sections 3.5 and 3.6.
> C-05 D-08

@L-13 | learn | Vimshottari: the period ladder | 120 years in all. The order is the same as the star lord order.
T Lord | Years | Stars it rules
Ketu | 7 | Ashwini, Magha, Mula
Venus | 20 | Bharani, P. Phalguni, P. Ashadha
Sun | 6 | Krittika, U. Phalguni, U. Ashadha
Moon | 10 | Rohini, Hasta, Shravana
